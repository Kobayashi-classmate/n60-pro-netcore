#
# 入口：ImmortalWrt
# 编译流程见 build.yml；由 check-update.yml 发现上游更新时通过 repository_dispatch 触发
#

name: ImmortalWrt

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-immortalwrt]

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      repo_url: https://github.com/immortalwrt/immortalwrt
      repo_branch: 'openwrt-25.12'
      config_file: immortalwrt.config
      diy_p1_sh: diy-part1.sh
      diy_p2_sh: diy-part4.sh
      firmware_tag: ImmortalWrt
