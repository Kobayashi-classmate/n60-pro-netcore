name: build (reusable)

on:
  workflow_call:
    inputs:
      repo_url:
        description: 源码仓库地址
        required: true
        type: string
      repo_branch:
        description: 源码分支
        required: true
        type: string
      config_file:
        description: .config 配置文件
        required: true
        type: string
      diy_p1_sh:
        description: feeds 更新前执行的脚本
        required: true
        type: string
      diy_p2_sh:
        description: feeds 安装后执行的脚本
        required: true
        type: string
      firmware_tag:
        description: 固件标识，用于 Release 标签和清理旧 Release
        required: true
        type: string
      profile:
        description: 软件包清单名称，对应 packages/<profile>.txt
        required: true
        type: string
      feeds_conf:
        description: 自定义 feeds.conf.default（仓库中存在时才生效）
        required: false
        type: string
        default: feeds.conf.default
      upload_bin_dir:
        description: 是否上传整个 bin 目录
        required: false
        type: boolean
        default: false
      upload_firmware:
        description: 是否上传固件 artifact
        required: false
        type: boolean
        default: true
      upload_release:
        description: 是否发布 Release
        required: false
        type: boolean
        default: true
      keep_releases:
        description: 该固件保留的 Release 数量
        required: false
        type: number
        default: 3

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: build-${{ inputs.firmware_tag }}
      cancel-in-progress: false

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
          p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
          python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
          unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      env:
        REPO_URL: ${{ inputs.repo_url }}
        REPO_BRANCH: ${{ inputs.repo_branch }}
      run: |
        df -hT $PWD
        git clone -b "$REPO_BRANCH" --single-branch --filter=blob:none "$REPO_URL" openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "SOURCE_COMMIT=$(git -C openwrt rev-parse HEAD)" >> $GITHUB_ENV

    - name: Load custom feeds
      env:
        FEEDS_CONF: ${{ inputs.feeds_conf }}
        DIY_P1_SH: ${{ inputs.diy_p1_sh }}
      run: |
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"
        bash "$GITHUB_WORKSPACE/scripts/customize.sh" feeds

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
        DIY_P2_SH: ${{ inputs.diy_p2_sh }}
        PROFILE: ${{ inputs.profile }}
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"
        bash "$GITHUB_WORKSPACE/scripts/customize.sh" apply "$PROFILE"

    - name: Generate configuration
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        cd openwrt
        make defconfig
        bash "$GITHUB_WORKSPACE/scripts/customize.sh" check "$PROFILE"
        mkdir -p $GITHUB_WORKSPACE/config-export
        cp .config $GITHUB_WORKSPACE/config-export/full.config
        ./scripts/diffconfig.sh > $GITHUB_WORKSPACE/config-export/seed.config
        wc -l $GITHUB_WORKSPACE/config-export/*.config

    - name: Upload configuration
      uses: actions/upload-artifact@v7
      with:
        name: config_${{ inputs.firmware_tag }}
        path: config-export/

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      if: steps.compile.outputs.status == 'success' && inputs.upload_bin_dir
      with:
        name: OpenWrt_bin_${{ inputs.firmware_tag }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && inputs.upload_firmware
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware_${{ inputs.firmware_tag }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && inputs.upload_release
      env:
        REPO_URL: ${{ inputs.repo_url }}
        REPO_BRANCH: ${{ inputs.repo_branch }}
        FIRMWARE_TAG: ${{ inputs.firmware_tag }}
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${FIRMWARE_TAG}" >> $GITHUB_OUTPUT
        {
          echo "- 源码：${REPO_URL} (${REPO_BRANCH})"
          echo "- 提交：${REPO_URL}/commit/${SOURCE_COMMIT}"
          echo "- 编译时间：$(date +"%Y-%m-%d %H:%M %Z")"
          if [ -f customize-report.md ]; then
            echo ""
            cat customize-report.md
          fi
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success'
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: steps.tag.outputs.status == 'success'
      with:
        keep_latest: ${{ inputs.keep_releases }}
        delete_tag_pattern: -${{ inputs.firmware_tag }}$
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
