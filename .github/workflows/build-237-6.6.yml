#
# 入口：237 mt798x 6.6
# 编译流程见 build.yml；由 check-update.yml 发现上游更新时通过 repository_dispatch 触发
#

name: 237 mt798x 6.6

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-237-6.6]

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      repo_url: https://github.com/padavanonly/immortalwrt-mt798x-6.6
      repo_branch: 'openwrt-24.10-6.6'
      config_file: padavanonly-immortalwrt-mt798x-6.6.config
      diy_p1_sh: diy-part1.sh
      diy_p2_sh: diy-part5-6.6.sh
      firmware_tag: padavanonly-237-mt798x-6.6
